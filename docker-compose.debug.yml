# Development only: Flask's dev server with the debugger on and the code mounted. The debugger lets anyone who can
# reach the port run code, so the port is bound to this computer only (127.0.0.1). Never use this on a server.
services:
  web:
    build: .
    ports:
      - "127.0.0.1:5858:5858"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PORT=5858
      - HOST=0.0.0.0
    command: flask run --host=0.0.0.0 --port=5858 --debug
    restart: unless-stopped
