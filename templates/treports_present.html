<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
body { margin: 0; background: #fff; color: #111; font: 1.35rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 52rem; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
h2 { font-size: 2.2rem; margin: 0 0 1.5rem; border-bottom: 4px solid #d0021b; padding-bottom: .5rem; }
h3 { font-size: 1.5rem; margin: 2rem 0 .5rem; }
ul { padding-left: 1.4rem; } li { margin: .25rem 0; }
table { border-collapse: collapse; } td, th { padding: .25rem .75rem; border-bottom: 1px solid #ddd; text-align: left; }
@media (max-width: 600px) { body { font-size: 1.1rem; } h2 { font-size: 1.6rem; } }
</style></head>
<body><main>{{ body }}</main></body></html>
